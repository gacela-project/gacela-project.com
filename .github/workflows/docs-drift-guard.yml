name: Docs drift guard

# Flags public API named in the latest Gacela release notes that appears
# nowhere in content/. Extraction is a heuristic over backticked tokens, so
# this is ADVISORY and never blocks a merge:
#   - schedule/manual: opens or updates one tracking issue
#   - pull_request:    emits ::warning annotations on the diff
#
# Silence an intentional omission by adding its symbol to the allowlist.
on:
  schedule:
    # Mondays 07:00 UTC, an hour after sync-gacela-version, so the bump has
    # landed before this reports on what the release introduced.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**"
      - ".github/workflows/docs-drift-guard.yml"

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALLOWLIST: data/undocumented-allowlist.txt
    steps:
      - uses: actions/checkout@v7

      - name: Find undocumented API in the latest release notes
        id: scan
        run: |
          set -euo pipefail
          tag=$(gh api repos/gacela-project/gacela/releases/latest --jq .tag_name)
          gh api repos/gacela-project/gacela/releases/latest --jq .body > release.md

          # A backticked token becomes one searchable key: Class::method() is
          # looked up as method(), #[Attr] as Attr. Phrases with spaces are
          # prose rather than symbols, so they are dropped.
          grep -oE '`[^`]+`' release.md | tr -d '`' | while read -r tok; do
            case "$tok" in *' '*) continue ;; esac
            key="${tok##*::}"
            key="${key#'#['}"
            key="${key%%'('*}"
            key="${key%%']'*}"
            printf '%s\n' "$key"
          done \
            | grep -E '^([a-z][a-zA-Z0-9]{3,}|[A-Z][A-Za-z0-9]{3,}|[a-z][a-z0-9-]*:[a-z][a-z0-9:-]*)$' \
            | sort -u > candidates.txt

          touch "$ALLOWLIST"
          : > missing.txt
          while read -r key; do
            [ -z "$key" ] && continue
            grep -qxF "$key" "$ALLOWLIST" && continue
            # content/, not just content/docs: a symbol named on /used-in or
            # /about is documented too, and flagging it would be noise.
            grep -rqF -- "$key" content/ && continue
            printf -- '- `%s`\n' "$key" >> missing.txt
          done < candidates.txt

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "missing<<EOF"
            cat missing.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Annotate the pull request
        if: github.event_name == 'pull_request' && steps.scan.outputs.missing != ''
        env:
          TAG: ${{ steps.scan.outputs.tag }}
          MISSING: ${{ steps.scan.outputs.missing }}
        run: |
          set -euo pipefail
          printf '%s\n' "$MISSING" | sed 's/^- `//; s/`$//' | while read -r key; do
            [ -n "$key" ] && echo "::warning title=Docs drift::'$key' from the $TAG release notes is not mentioned in content/"
          done

      - name: Open or update the tracking issue
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.scan.outputs.missing != ''
        env:
          TAG: ${{ steps.scan.outputs.tag }}
          MISSING: ${{ steps.scan.outputs.missing }}
        run: |
          set -euo pipefail
          title="Docs drift: undocumented API in Gacela $TAG"
          rel="https://github.com/gacela-project/gacela/releases/tag/$TAG"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "These symbols from the [$TAG release notes]($rel) appear nowhere in \`content/\`:" \
            "$MISSING" \
            "Document them, or add the ones that are deliberately internal to \`$ALLOWLIST\`. The check is a heuristic, so false positives are possible.")

          # One issue per release, updated rather than duplicated on reruns.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
