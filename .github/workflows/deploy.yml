name: Deploy

# Publishes dist/ to GitHub Pages. master is production and there is no
# staging environment (see CLAUDE.md), so this runs on every push to master,
# plus workflow_dispatch for a manual re-deploy (e.g. to pick up a Pages
# configuration change without a new commit).
on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege for the standard GitHub Pages artifact flow: read the repo,
# write the Pages deployment, and mint the OIDC token deploy-pages
# authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment should ever be in flight. Do not cancel one
# that's already running, a half-applied deploy would leave the live site
# broken; a new push just queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Latest 22.x, which satisfies the ">=22.18.0" engines floor without
          # freezing production on one patch release.
          node-version: "22"
          cache: npm

      - run: npm ci

      # The same checks ci.yml runs. They are repeated here on purpose: master
      # deploys straight to production, and ci.yml runs in a separate workflow
      # that this one does not wait for. Without this, a merge whose tests fail
      # would still publish as long as the build itself succeeded, and the only
      # thing standing in the way would be a branch protection rule configured
      # outside the repository.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Lint links
        run: npm run lint:links

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job that `needs: build`, so anything the build job rejects,
  # including a failing test or a dead link, stops here and nothing is
  # published. This job's only responsibility is turning a verified artifact
  # into a live deployment.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
