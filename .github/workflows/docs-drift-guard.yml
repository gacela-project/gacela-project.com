name: Docs drift guard

# Flags public API mentioned in the latest Gacela release notes that is not
# referenced anywhere in docs/. Extraction is heuristic (backtick tokens), so
# this is ADVISORY — it never blocks a merge:
#   - schedule/manual: opens (or updates) a tracking issue
#   - pull_request:    emits ::warning annotations
# Silence intentional omissions via docs/.vitepress/undocumented-allowlist.txt.

on:
  schedule:
    # Mondays 07:00 UTC, ~1h after the version bumper (update-gacela-version).
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-drift-guard.yml'

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALLOWLIST: docs/.vitepress/undocumented-allowlist.txt
    steps:
      - uses: actions/checkout@v4

      - name: Find undocumented API from latest release notes
        id: scan
        run: |
          set -euo pipefail
          tag=$(gh api repos/gacela-project/gacela/releases/latest --jq .tag_name)
          gh api repos/gacela-project/gacela/releases/latest --jq .body > release.md

          # Backticked token -> single searchable key (method / attribute / command).
          grep -oE '`[^`]+`' release.md | tr -d '`' | while read -r tok; do
            case "$tok" in *' '*) continue ;; esac  # skip prose phrases, keep single symbols
            key="${tok##*::}"    # Class::method() -> method()
            key="${key#'#['}"    # #[Attr] -> Attr]
            key="${key%%'('*}"   # drop "(...)"
            key="${key%%']'*}"   # drop trailing "]"
            printf '%s\n' "$key"
          done \
            | grep -E '^([a-z][a-zA-Z0-9]{3,}|[A-Z][A-Za-z0-9]{3,}|[a-z][a-z0-9-]*:[a-z][a-z0-9:-]*)$' \
            | sort -u > candidates.txt

          touch "$ALLOWLIST"
          : > missing.txt
          while read -r key; do
            [ -z "$key" ] && continue
            grep -qxF "$key" "$ALLOWLIST" && continue
            grep -rqF -- "$key" docs/ && continue
            printf -- '- `%s`\n' "$key" >> missing.txt
          done < candidates.txt

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "missing<<EOF"
            cat missing.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Annotate (pull request)
        if: github.event_name == 'pull_request' && steps.scan.outputs.missing != ''
        env:
          TAG: ${{ steps.scan.outputs.tag }}
          MISSING: ${{ steps.scan.outputs.missing }}
        run: |
          set -euo pipefail
          printf '%s\n' "$MISSING" | sed 's/^- `//; s/`$//' | while read -r key; do
            [ -n "$key" ] && echo "::warning title=Docs drift::'$key' from $TAG release notes not found in docs/"
          done

      - name: Open/update tracking issue (schedule & manual)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.scan.outputs.missing != ''
        env:
          TAG: ${{ steps.scan.outputs.tag }}
          MISSING: ${{ steps.scan.outputs.missing }}
        run: |
          set -euo pipefail
          title="Docs drift: undocumented API in Gacela $TAG"
          rel="https://github.com/gacela-project/gacela/releases/tag/$TAG"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "These symbols from the [$TAG release notes]($rel) were not found anywhere in \`docs/\`:" \
            "$MISSING" \
            "Document them, or add intentionally-internal ones to \`$ALLOWLIST\`. Heuristic check — false positives possible.")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
